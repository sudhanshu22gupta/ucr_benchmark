[project]
name = "ucr-benchmark"
version = "0.1.0"
description = "Benchmark time series classifiers on UCR archive datasets"
readme = "README.md"
authors = [
    { name = "Sudhanshu Gupta", email = "sudhanshu22gupta@gmail.com" }
]
requires-python = ">=3.10"
dependencies = [
    "aeon>=1.0.0",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "tensorflow>=2.20.0",
]

[project.optional-dependencies]
deep = ["tensorflow"]
mlflow = ["mlflow"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[build-system]
requires = ["uv_build>=0.10.2,<0.11.0"]
build-backend = "uv_build"
